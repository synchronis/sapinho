<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas</title>
    <link rel="stylesheet" href="/aula1/assets/css/style.css">
</head>
<body>

    <main class="container">
        <div class="card">
            <h1>Minhas tarefas</h1>

            <div class="form">
                <input
                    type="text"
                    id="tarefaInput"
                    placeholder="Digite uma tarefa..."
                >
                <button id="adicionarBtn">Adicionar</button>
            </div>

            <p id="contador">0 tarefas pendentes</p>

            <div class="filtros">
                <button class="filtro ativo" data-filtro="todas">
                    Todas
                </button>

                <button class="filtro" data-filtro="pendentes">
                    Pendentes
                </button>

                <button class="filtro" data-filtro="concluidas">
                    Concluídas
                </button>
            </div>

            <ul id="listaTarefas"></ul>
        </div>
    </main>

    <script src="/aula1/assets/js/index.js"></script>
</body>
</html>
